<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Accessible Contact Information Form</title>
    </head>
    <body>
        <header>
            <h1>Welcome to My Accessible Page</h1>
        </header>
        <main>
            <p>This webpage follows basic accessibility guidelines.</p>
            <img src="https://www.lib.umn.edu/sites/www.lib.umn.edu/themes/umnlib/img/ul.png"
            height="80" alt="University of Minnesota Logo">
            <div>
                <h2>Contact Form</h2>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name"><br><br>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email"><br><br>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone"><br><br>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </main>
        <footer>
            <p>© 2026 Accessible Website</p>
        </footer>
    </body>
</html>
